<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tree Tap — the tree of life game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8f5; --paper:#ffffff; --ink:#122019; --muted:#6b7f74; --line:#b7c5bc; --soft:#e6ede8;
    --green:#17b26a; --green-ink:#0b7a46; --orange:#ff5d38; --orange-ink:#b83b1c; --blue:#2f6bff;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{overflow:hidden}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 42%, #ffffff 0%, var(--bg) 62%)}
  #stage.dragging{cursor:grabbing}
  #layer{position:absolute;inset:0;will-change:transform;transform-origin:0 0;pointer-events:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;text-rendering:optimizeSpeed;pointer-events:none}
  #view.lowzoom .lbl,#view.lowzoom .tick{visibility:hidden}
  
  .dots-static{fill:#fff;stroke:var(--dc,var(--line));stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:var(--eo,1)}
  .mark{fill:#fff;stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center}
  .mark.picked{fill:var(--orange);stroke:var(--orange)}
  .mark.correct{fill:var(--green);stroke:var(--green);animation:pop .5s var(--ease)}
  .mark.picked.correct{fill:var(--green);stroke:var(--orange);stroke-width:3}
  .mark.lca{fill:#fff;stroke:var(--ink);stroke-width:2.5}
  .edge{fill:none;stroke:var(--dc,var(--line));stroke-width:1.3;stroke-opacity:var(--eo,1);vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .edge.path{stroke:var(--ink);stroke-width:3;stroke-opacity:1}
  .route-glow{fill:none;stroke:url(#routeGrad);stroke-width:22;stroke-opacity:.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:url(#glow)}
  .route{fill:none;stroke:url(#routeGrad);stroke-width:5;filter:drop-shadow(0 0 4px rgba(255,255,255,.9));stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--dur,.7s) cubic-bezier(.2,0,.1,1) forwards}
  .comet{fill:#fff;stroke:#ffd23f;stroke-width:3;vector-effect:non-scaling-stroke;filter:url(#glow)}
  .comet.t1{opacity:.6} .comet.t2{opacity:.35} .comet.t3{opacity:.18}
  .ping{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ping .8s cubic-bezier(.2,.8,.2,1) infinite}
  .ping.o{stroke:var(--orange)} .ping.g{stroke:var(--green)}
  @keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(4);opacity:0}}
  .lcaTag{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:12px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;opacity:0;animation:fadeup .4s .45s var(--ease) forwards}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confetti{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;will-change:transform,opacity}
  .status .pts{display:inline-block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;color:var(--ink);min-width:2.2ch}
  .status .pts.big{animation:pop .5s var(--ease)}
  .edge.path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .tick{stroke:#d3dcd6;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 3}
  .node circle{fill:#fff;stroke:var(--dc,var(--line));stroke-width:1.2;vector-effect:non-scaling-stroke;transition:transform .18s var(--ease);transform-box:fill-box;transform-origin:center}
  .node.clade circle{fill:#fff;stroke:var(--dc,#9fb0a6);stroke-width:1.6}
  .node.picked circle{fill:var(--orange);stroke:var(--orange);transform:scale(1.9)}
  .node.correct circle{fill:var(--green);stroke:var(--green);transform:scale(1.9);animation:pop .5s var(--ease)}
  .node.picked.correct circle{fill:var(--green);stroke:var(--orange);stroke-width:3;transform:scale(2.2)}
  .node.lca circle{fill:#fff;stroke:var(--ink);stroke-width:2.5;transform:scale(1.6)}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(2.4)}100%{transform:scale(1.9)}}
  text{font-family:"Instrument Sans",system-ui,sans-serif;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
  .lbl{font-size:10px;fill:var(--ink);font-weight:500;stroke-width:3px}
  .lbl.picked{fill:var(--orange-ink);font-weight:600}
  .lbl.correct{fill:var(--green-ink);font-weight:600}
  .clbl{font-size:6px;fill:var(--dk,#5b6f65);opacity:0;stroke-width:2.6px;font-weight:600}
  .clbl.major[data-lvl="3"]{font-weight:500}
  .clbl.major{font-size:var(--fs,10px);opacity:1;font-weight:700;stroke-width:calc(var(--fs,10px) * .32);fill:var(--dk,#40554b)}
  .clbl.major.l2{display:none} #view.z2 .clbl.major.l2{display:block}
  .wedge{stroke:none;opacity:.07}
  .hold{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;border:3px solid var(--orange);box-sizing:border-box}
  .hold.on{opacity:1;animation:holdfill .45s linear forwards}
  @keyframes holdfill{from{transform:translate(-50%,-50%) scale(1.6);opacity:.2}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .legend{position:fixed;left:12px;top:calc(58px + env(safe-area-inset-top));display:flex;gap:10px;font-size:11.5px;font-weight:600;color:#3c4f46;background:rgba(255,255,255,.8);padding:6px 10px;border-radius:999px;box-shadow:0 0 0 1px rgba(18,32,25,.05);pointer-events:none}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  #view.zoomed .clbl{opacity:1}
  .clbl.picked,.clbl.lca{opacity:1;fill:var(--ink)}
  #view.nolabels .clbl{opacity:0!important}
  #view.nolabels .clbl.picked,#view.nolabels .clbl.lca{opacity:1!important}
  #view.notips .lbl,#view.notips .tick{opacity:0}
  #view.notips.revealed .lbl.correct,#view.notips.revealed .lbl.picked,#view.notips.revealed .tick.show{opacity:1}
  #view.notips .clbl{opacity:1}
  #stage.locked{cursor:default}

  .hover{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none}
  .hover i{display:block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.7);margin:0 auto}
  .hover span{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--paper);font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 6px rgba(18,32,25,.15)}
  .disc{fill:var(--dc,#ccc);stroke:var(--dc,#ccc);stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.06;stroke-opacity:.35}
  .leafblob{stroke:none;fill:var(--dc,var(--line));opacity:.55}
  .chip{position:absolute;transform:translate(-50%,-130%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s}
  .chip.on{opacity:1} .chip.green{background:var(--green-ink)}
  .chip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}

  .top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
  .top > *{pointer-events:auto}
  .pill{background:var(--paper);border-radius:999px;box-shadow:0 2px 10px rgba(18,32,25,.08),0 0 0 1px rgba(18,32,25,.05);padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .dots{display:flex;gap:4px}
  .dots i{width:16px;height:6px;border-radius:3px;background:var(--soft);transition:background .2s}
  .dots i.now{background:var(--orange)} .dots i.done{background:var(--green)} .dots i.done.miss{background:#f3c26b}
  .timer{margin-left:auto;font-variant-numeric:tabular-nums;min-width:84px;justify-content:center;position:relative;overflow:hidden;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;padding:6px 14px}
  .timer .tlab{font-size:13px;opacity:.6} .timer .bar{height:4px}
  .timer.crit{background:var(--orange);color:#fff;animation:tpulse .5s ease-in-out infinite} .timer.crit .bar{background:#fff}
  @keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #stage.crit::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 6px rgba(255,60,40,.9),inset 0 0 90px rgba(255,60,40,.55);animation:redflash .5s ease-in-out infinite}
  @keyframes redflash{0%,100%{opacity:.25}50%{opacity:1}}
  .bigt{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:140px;color:rgba(255,60,40,.9);pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(255,255,255,.9)}
  .bigt.on{opacity:1} .bigt.beat{animation:beat .5s var(--ease)}
  @keyframes beat{0%{transform:translate(-50%,-50%) scale(1.5);opacity:.4}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:100%;transition:width .2s linear}
  .timer.low{color:var(--orange-ink)} .timer.low .bar{background:var(--orange)}
  .icon{width:38px;height:38px;padding:0;justify-content:center;border:0;cursor:pointer;font-size:16px}

  .sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
  .sheet > .inner{pointer-events:auto;width:100%;max-width:520px;margin:0 8px;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(18,32,25,.12),0 0 0 1px rgba(18,32,25,.05);padding:14px 18px calc(14px + env(safe-area-inset-bottom));transition:transform .3s var(--ease)}
  .sheet.hide > .inner{transform:translateY(120%)}
  .head{display:grid;grid-template-columns:1fr 96px;gap:14px;align-items:start}
  .pic{width:96px;height:96px;border-radius:16px;background:var(--soft);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(18,32,25,.06)}
  .pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
  .pic img.ok{opacity:1}
  .pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;color:#a9b9af}
  .pic .cr{position:absolute;right:0;bottom:0;font-size:9px;background:rgba(255,255,255,.85);color:var(--muted);padding:2px 5px;border-radius:6px 0 0 0;text-decoration:none;opacity:0}
  .pic img.ok + .cr, .pic .cr.on{opacity:1}
  .lvl{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px}
  .oname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1;margin:0;letter-spacing:-.02em}
  .oname i{font-family:"Instrument Sans",sans-serif;font-style:italic;font-weight:400;font-size:14px;color:var(--muted);margin-left:8px;letter-spacing:0}
  .blurb{margin:6px 0 10px;font-size:14px;line-height:1.4;color:#3c4f46;max-width:56ch}
  .status{font-size:14px;line-height:1.4;margin:0 0 10px;min-height:20px}
  .status b{color:var(--orange-ink)} .status .ok{color:var(--green-ink);font-weight:600} .status .path{color:var(--muted)}
  .go{width:100%;border:0;border-radius:14px;padding:15px;font:700 16px "Bricolage Grotesque",sans-serif;background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s var(--ease),background .15s}
  .go:active{transform:scale(.98)}
  .go.orange{background:var(--orange)} .go.green{background:var(--green)} .go.ghost{background:var(--soft);color:var(--ink)}
  .go:disabled{background:var(--soft);color:var(--muted);cursor:default}
  .go:focus-visible,.icon:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  .overlay{position:fixed;inset:0;background:rgba(245,248,245,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.on{opacity:1;pointer-events:auto}
  .card{width:100%;max-width:520px;background:var(--paper);border-radius:24px 24px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -10px 40px rgba(18,32,25,.15);transform:translateY(30px);transition:transform .3s var(--ease)}
  .overlay.on .card{transform:none}
  .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:.95;letter-spacing:-.04em;margin:0}
  .big small{font-size:15px;font-weight:600;font-family:"Instrument Sans",sans-serif;color:var(--muted);letter-spacing:0;margin-left:8px}
  .rank{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:22px;margin:10px 0 2px}
  .sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 16px}
  .pips{font-size:22px;letter-spacing:2px;margin-bottom:14px}
  .scoreline{display:flex;flex-wrap:wrap;gap:10px 14px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:2px 0 10px}
  .scoreline i,.rr .d i{font-style:normal;font-size:.85em;margin-left:2px}
  .overlay.peek{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
  .overlay.peek .card{pointer-events:auto;box-shadow:0 -10px 40px rgba(18,32,25,.25)}
  .rr .em{font-size:26px;line-height:1;width:34px;text-align:center}
  .rr .n small{font-weight:600;color:var(--muted);font-size:12px;margin-left:4px}
  .rr .d{white-space:nowrap}
  .rr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);margin-bottom:6px}
  .rr .n{font-weight:600;font-size:15px} .rr .w{font-size:12.5px;color:var(--muted);margin-top:2px} .rr .w span{color:var(--ink)}
  .rr .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;min-width:2ch;text-align:right}
  .rr .d.z{color:var(--green-ink)}
  .row{display:flex;gap:8px;margin-top:14px} .row .go{flex:1}
  .opt{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg button{text-align:left;border:2px solid var(--soft);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seg button.on{border-color:var(--ink);background:var(--bg)}
  .seg b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin-bottom:2px}
  .seg span{font-size:12px;color:var(--muted);line-height:1.35}
  .toast{position:fixed;left:50%;bottom:calc(var(--sheetH,200px) + 14px);transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="layer">
  <canvas id="cv"></canvas>
  <svg id="svg" aria-label="Tree of life. Drag to pan, pinch or scroll to zoom, tap a branch to place the organism."><g id="view"></g></svg>
  <svg id="fx"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><linearGradient id="routeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5d38"/><stop offset="1" stop-color="#17b26a"/></linearGradient></defs><g id="fxview"><g id="hl"></g><g id="marks"></g></g></svg>
  </div>
  <div class="chip" id="chip"></div>
  <div class="hold" id="hold"></div>
  <div class="hover" id="hover"><span></span><i></i></div>
</div>
<div class="top">
  <div class="pill"><span class="brand">Tree Tap</span><span class="dots" id="dots"></span></div>
  <div class="pill timer" id="timer"><span class="tlab">⏱</span><span id="tval">30</span><span class="bar" id="tbar"></span></div>
  <button class="pill icon" id="fit" title="Fit whole tree" aria-label="Fit whole tree">⤢</button>
</div>
<div class="legend" id="legend"></div>
<div class="sheet" id="sheet"><div class="inner">
  <div class="head"><div>
    <p class="lvl" id="lvl"></p>
    <h2 class="oname" id="oname"></h2>
    <p class="blurb" id="blurb"></p>
  </div><div class="pic" id="pic"><div class="ph" id="ph"></div><img id="img" alt=""><a class="cr" id="cr" target="_blank" rel="noopener">Wikipedia</a></div></div>
  <p class="status" id="status"></p>
  <button class="go" id="go" disabled>Tap a branch to place it</button>
</div></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<div class="bigt" id="bigt"></div>
<script>

    finalPre>=200?["Curious amateur","The big groups are there; the fine structure needs another look."]:
    ["Cambrian explosion","Lots of branches in play. The tree makes more sense every run."];
  const modeTxt=(EASY?"easy":"normal")+(SCOPE==="bacteria"?" · bacteria only":"");
  const scores=hist.map(h=>pts(h.dist,h.timedOut)), final=scores.reduce((a,b)=>a+b,0);
  $("card").innerHTML=`<p class="sub" style="margin:0 0 4px">Tree Tap #${dayNum()} · ${new Date().toLocaleDateString(undefined,{month:"long",day:"numeric"})} · ${modeTxt}</p>
    <div class="scoreline">${scores.map(p=>`<span>${p}<i>${tier(p)}</i></span>`).join("")}</div>
    <p class="big">${final}<small>final score · ${total} branches off · ${fmt(totalMs)}</small></p><p class="rank">${rank}</p><p class="sub">${sub}</p>
    ${hist.map(h=>`<div class="rr"><div class="em">${emo(byName[h.o.leaf])}</div><div><div class="n">${h.o.name} <small>${h.timedOut?"no placement":h.dist+" branch"+(h.dist===1?"":"es")+" · "+verdict(h.dist)}</small></div><div class="w">${h.dist===0?`<span>${h.o.leaf}</span>`:`${h.timedOut?"no placement":"you chose "+h.guess} · belongs with <span>${h.o.leaf}</span>`}</div></div><div class="d ${h.dist===0?'z':''}">${pts(h.dist,h.timedOut)}<i>${tier(pts(h.dist,h.timedOut))}</i></div></div>`).join("")}
    <div class="row"><button class="go ghost" id="again">Replay today</button><button class="go green" id="share">Share score</button></div>`;
  $("overlay").classList.add("on"); $("again").onclick=newGame;
  $("share").onclick=async()=>{ const text=`Tree Tap #${dayNum()} ${new Date().toLocaleDateString(undefined,{month:"long",day:"numeric"})}${SCOPE==="bacteria"?" (bacteria)":""}${EASY?" (easy)":""}\n${scores.map(p=>p+tier(p)).join(" ")}\nFinal score: ${final}\n${location.href.split("#")[0]}`;
    try{ if(navigator.share) await navigator.share({title:"Tree Tap",text}); else { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } }
    catch(e){ try{await navigator.clipboard.writeText(text);toast("Copied to clipboard");}catch(_){toast("Couldn't share");} } };
}
new ResizeObserver(()=>document.body.style.setProperty("--sheetH",document.getElementById("sheet").offsetHeight+"px")).observe(document.querySelector("#sheet .inner"));
size(); newGame();
</script>
</body>
