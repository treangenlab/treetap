<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tree Tap — the tree of life game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8f5; --paper:#ffffff; --ink:#122019; --muted:#6b7f74; --line:#b7c5bc; --soft:#e6ede8;
    --green:#17b26a; --green-ink:#0b7a46; --orange:#ff5d38; --orange-ink:#b83b1c; --blue:#2f6bff;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{overflow:hidden}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 42%, #ffffff 0%, var(--bg) 62%)}
  #stage.dragging{cursor:grabbing}
  #svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
  .edge{fill:none;stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .edge.path{stroke:var(--ink);stroke-width:3}
  .edge.path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .tick{stroke:#d3dcd6;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 3}
  .node circle{fill:#fff;stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke;transition:transform .18s var(--ease);transform-box:fill-box;transform-origin:center}
  .node.clade circle{fill:var(--soft);stroke:#9fb0a6}
  .node.picked circle{fill:var(--orange);stroke:var(--orange);transform:scale(1.9)}
  .node.correct circle{fill:var(--green);stroke:var(--green);transform:scale(1.9);animation:pop .5s var(--ease)}
  .node.picked.correct circle{fill:var(--green);stroke:var(--orange);stroke-width:3;transform:scale(2.2)}
  .node.lca circle{fill:#fff;stroke:var(--ink);stroke-width:2.5;transform:scale(1.6)}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(2.4)}100%{transform:scale(1.9)}}
  text{font-family:"Instrument Sans",system-ui,sans-serif;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
  .lbl{font-size:10px;fill:var(--ink);font-weight:500;stroke-width:3px}
  .lbl.picked{fill:var(--orange-ink);font-weight:600}
  .lbl.correct{fill:var(--green-ink);font-weight:600}
  .clbl{font-size:6px;fill:#5b6f65;opacity:0;transition:opacity .2s;stroke-width:2.6px;font-weight:600}
  .clbl.major{font-size:7.5px;fill:#40554b;opacity:1}
  #view.zoomed .clbl{opacity:1}
  .clbl.picked,.clbl.lca{opacity:1;fill:var(--ink)}
  #view.nolabels .clbl{opacity:0!important}
  #view.nolabels .clbl.picked,#view.nolabels .clbl.lca{opacity:1!important}
  #view.notips .lbl,#view.notips .tick{opacity:0}
  #view.notips.revealed .lbl.correct,#view.notips.revealed .lbl.picked,#view.notips.revealed .tick.show{opacity:1}
  #view.notips .clbl{opacity:1}
  #stage.locked{cursor:default}

  .chip{position:absolute;transform:translate(-50%,-130%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s}
  .chip.on{opacity:1} .chip.green{background:var(--green-ink)}
  .chip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}

  .top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
  .top > *{pointer-events:auto}
  .pill{background:var(--paper);border-radius:999px;box-shadow:0 2px 10px rgba(18,32,25,.08),0 0 0 1px rgba(18,32,25,.05);padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .dots{display:flex;gap:4px}
  .dots i{width:16px;height:6px;border-radius:3px;background:var(--soft);transition:background .2s}
  .dots i.now{background:var(--orange)} .dots i.done{background:var(--green)} .dots i.done.miss{background:#f3c26b}
  .timer{margin-left:auto;font-variant-numeric:tabular-nums;min-width:74px;justify-content:center;position:relative;overflow:hidden}
  .timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:100%;transition:width .2s linear}
  .timer.low{color:var(--orange-ink)} .timer.low .bar{background:var(--orange)}
  .icon{width:38px;height:38px;padding:0;justify-content:center;border:0;cursor:pointer;font-size:16px}

  .sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
  .sheet > .inner{pointer-events:auto;width:100%;max-width:520px;margin:0 8px;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(18,32,25,.12),0 0 0 1px rgba(18,32,25,.05);padding:14px 18px calc(14px + env(safe-area-inset-bottom));transition:transform .3s var(--ease)}
  .sheet.hide > .inner{transform:translateY(120%)}
  .lvl{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px}
  .oname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1;margin:0;letter-spacing:-.02em}
  .oname i{font-family:"Instrument Sans",sans-serif;font-style:italic;font-weight:400;font-size:14px;color:var(--muted);margin-left:8px;letter-spacing:0}
  .blurb{margin:6px 0 10px;font-size:14px;line-height:1.4;color:#3c4f46;max-width:56ch}
  .status{font-size:14px;line-height:1.4;margin:0 0 10px;min-height:20px}
  .status b{color:var(--orange-ink)} .status .ok{color:var(--green-ink);font-weight:600} .status .path{color:var(--muted)}
  .go{width:100%;border:0;border-radius:14px;padding:15px;font:700 16px "Bricolage Grotesque",sans-serif;background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s var(--ease),background .15s}
  .go:active{transform:scale(.98)}
  .go.orange{background:var(--orange)} .go.green{background:var(--green)} .go.ghost{background:var(--soft);color:var(--ink)}
  .go:disabled{background:var(--soft);color:var(--muted);cursor:default}
  .go:focus-visible,.icon:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  .overlay{position:fixed;inset:0;background:rgba(245,248,245,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.on{opacity:1;pointer-events:auto}
  .card{width:100%;max-width:520px;background:var(--paper);border-radius:24px 24px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -10px 40px rgba(18,32,25,.15);transform:translateY(30px);transition:transform .3s var(--ease)}
  .overlay.on .card{transform:none}
  .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:.95;letter-spacing:-.04em;margin:0}
  .big small{font-size:15px;font-weight:600;font-family:"Instrument Sans",sans-serif;color:var(--muted);letter-spacing:0;margin-left:8px}
  .rank{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:22px;margin:10px 0 2px}
  .sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 16px}
  .pips{font-size:22px;letter-spacing:2px;margin-bottom:14px}
  .rr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);margin-bottom:6px}
  .rr .n{font-weight:600;font-size:15px} .rr .w{font-size:12.5px;color:var(--muted);margin-top:2px} .rr .w span{color:var(--ink)}
  .rr .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;min-width:2ch;text-align:right}
  .rr .d.z{color:var(--green-ink)}
  .row{display:flex;gap:8px;margin-top:14px} .row .go{flex:1}
  .opt{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg button{text-align:left;border:2px solid var(--soft);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .seg button.on{border-color:var(--ink);background:var(--bg)}
  .seg b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin-bottom:2px}
  .seg span{font-size:12px;color:var(--muted);line-height:1.35}
  .toast{position:fixed;left:50%;bottom:calc(var(--sheetH,200px) + 14px);transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" aria-label="Tree of life. Drag to pan, pinch or scroll to zoom, tap a branch to place the organism."><g id="view"></g></svg>
  <div class="chip" id="chip"></div>
</div>
<div class="top">
  <div class="pill"><span class="brand">Tree Tap</span><span class="dots" id="dots"></span></div>
  <div class="pill timer" id="timer"><span id="tval">0:45</span><span class="bar" id="tbar"></span></div>
  <button class="pill icon" id="fit" title="Fit whole tree" aria-label="Fit whole tree">⤢</button>
</div>
<div class="sheet" id="sheet"><div class="inner">
  <p class="lvl" id="lvl"></p>
  <h2 class="oname" id="oname"></h2>
  <p class="blurb" id="blurb"></p>
  <p class="status" id="status"></p>
  <button class="go" id="go" disabled>Tap a branch to place it</button>
</div></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>

  else if(ptrs.size===2&&pinch){ const [a,b]=[...ptrs.values()]; s=Math.min(8,Math.max(.08,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));
    const bx=stage.getBoundingClientRect(); tx=(a.x+b.x)/2-bx.left-W/2-pinch.world.x*s; ty=(a.y+b.y)/2-bx.top-H/2-pinch.world.y*s; apply(); } });
function up(e){ const wasTap=ptrs.size===1&&start&&!start.moved&&Date.now()-start.t<400; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){ stage.classList.remove("dragging"); if(wasTap) tap(e.clientX,e.clientY); start=null; } }
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",e=>{ e.preventDefault(); const w=toWorld(e.clientX,e.clientY); s=Math.min(8,Math.max(.08,s*Math.exp(-e.deltaY*0.0015)));
  const b=stage.getBoundingClientRect(); tx=e.clientX-b.left-W/2-w.x*s; ty=e.clientY-b.top-H/2-w.y*s; apply(); },{passive:false});
document.getElementById("fit").onclick=()=>fit();
function nearest(cx,cy){ const w=toWorld(cx,cy); const th=Math.max(14,22/s); let best=null,bd=th;
  nodes.forEach(n=>{ let d=Math.hypot(n.x-w.x,n.y-w.y);
    if(!n.children.length && !(MODE==="clades")){ const len=(n.lbl.textContent.length*5.2)+13; const proj=(w.x-n.x)*n.ux+(w.y-n.y)*n.uy; const c=Math.max(0,Math.min(len,proj)); d=Math.min(d,Math.hypot(n.x+n.ux*c-w.x,n.y+n.uy*c-w.y)*0.9); }
    if(d<bd){bd=d;best=n;} }); return best; }

// ================= GAME =================
const $=id=>document.getElementById(id);
let round=0,picked=null,locked=false,hist=[],orgs=[],timerId=null,tLeft=0,roundStart=0,totalMs=0;
const rand=a=>a[Math.floor(Math.random()*a.length)];
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
const dn=n=>(MODE==="latin"&&!n.children.length)?LATIN[n.name]:n.name;

function newGame(){ $("sheet").classList.add("hide"); render(); fit();
  $("card").innerHTML=`<p class="rank" style="font-size:26px;margin:0">Tree Tap</p><p class="sub" style="margin-bottom:0">Five organisms, easy to expert. Tap where each belongs on the tree of life. Score is branches off; lower is better.</p>
    <p class="opt">Tree shape</p><div class="seg" id="segL"><button data-v="radial"><b>Circular</b><span>Life radiates from the centre; ${N} tips around the rim.</span></button><button data-v="rect"><b>Cladogram</b><span>Classic left-to-right tree; scroll down through the tips.</span></button></div>
    <p class="opt">Labels</p><div class="seg" id="segM"><button data-v="clades"><b>Clade names only</b><span>Tips are unlabelled. Navigate by the named groups and commit blind.</span></button><button data-v="latin"><b>Latin tips</b><span>Tips carry scientific group names only. Clade names vanish in rounds 4–5.</span></button></div>
    <button class="go" id="start" style="margin-top:16px">Start</button>`;
  const seg=(id,cur,set)=>{ const box=$(id); [...box.children].forEach(b=>{ b.classList.toggle("on",b.dataset.v===cur); b.onclick=()=>{ set(b.dataset.v); [...box.children].forEach(x=>x.classList.toggle("on",x===b)); }; }); };
  seg("segL",LAYOUT,v=>{LAYOUT=v;render();fit();}); seg("segM",MODE,v=>MODE=v);
  $("overlay").classList.add("on"); $("start").onclick=begin; }
function begin(){ render(); view.classList.toggle("notips",MODE==="clades"); round=0;hist=[];totalMs=0; orgs=POOLS.map(p=>rand(p));
  $("overlay").classList.remove("on"); $("sheet").classList.remove("hide"); fit(); startRound(); toast("Drag to pan · pinch or scroll to zoom"); }
function dots(){ $("dots").innerHTML=orgs.map((_,i)=>`<i class="${i<round?'done'+(hist[i]&&hist[i].dist>0?' miss':''):i===round?'now':''}"></i>`).join(""); }
function clearMarks(){ nodes.forEach(n=>{ n.g.classList.remove("picked","correct","lca"); n.edge&&n.edge.classList.remove("path","draw"); n.lbl&&n.lbl.classList.remove("picked","correct","lca"); n.tick&&n.tick.classList.remove("show"); }); chip.classList.remove("on","green"); chipNode=null; }
function startRound(){
  picked=null;locked=false; clearMarks(); stage.classList.remove("locked"); view.classList.remove("revealed");
  view.classList.toggle("nolabels",MODE==="latin"&&round>=BLIND_FROM);
  const o=orgs[round];
  $("lvl").textContent=LEVELS[round]+(MODE==="latin"&&round>=BLIND_FROM?" · clade names hidden":"");
  $("oname").innerHTML=`${o.name}<i>${o.sci}</i>`; $("blurb").textContent=o.blurb;
  $("status").innerHTML=`Tap the branch where <b>${o.name}</b> belongs. A tip is exact; a clade is a safe hedge.`;
  const go=$("go"); go.disabled=true; go.className="go"; go.textContent="Tap a branch to place it"; go.onclick=()=>confirm(false);
  dots(); startTimer();
}
function startTimer(){ clearInterval(timerId); tLeft=ROUND_SECONDS; roundStart=Date.now(); tick();
  timerId=setInterval(()=>{ tLeft=ROUND_SECONDS-(Date.now()-roundStart)/1000; if(tLeft<=0){tLeft=0;tick();clearInterval(timerId);timeout();} else tick(); },100); }
function tick(){ const m=Math.floor(tLeft/60), sec=Math.floor(tLeft%60); $("tval").textContent=`${m}:${String(sec).padStart(2,"0")}`; $("tbar").style.width=(tLeft/ROUND_SECONDS*100)+"%"; $("timer").classList.toggle("low",tLeft<=10); }
function timeout(){ if(locked) return; if(picked) confirm(false); else { picked=root.name; confirm(true); } }
function tap(cx,cy){ if(locked) return; const n=nearest(cx,cy); if(n) pick(n); }
function pick(n){ picked=n.name; nodes.forEach(m=>{m.g.classList.toggle("picked",m===n); m.lbl&&m.lbl.classList.toggle("picked",m===n);});
  const hide=MODE==="clades"&&!n.children.length; chip.textContent=hide?"Branch tip":dn(n); chip.classList.remove("green"); chip.classList.add("on"); chipNode=n; placeChip();
  const o=orgs[round]; const go=$("go"); go.disabled=false; go.className="go orange"; go.textContent=`Place ${o.name} here`;
  $("status").innerHTML=n.children.length?`Placing in the <b>${n.name}</b> clade — a hedge, so at least ${n.h} branch${n.h>1?"es":""} off.`:hide?`Placing <b>${o.name}</b> at an unlabelled tip, inside <b>${n.parent.name}</b>.`:`Placing <b>${o.name}</b> with <b>${dn(n)}</b>.`; }
function confirm(timedOut){
  if(!picked||locked) return; locked=true; clearInterval(timerId); stage.classList.add("locked"); totalMs+=Date.now()-roundStart;
  const o=orgs[round], g=byName[picked], c=byName[o.leaf], p=pathBetween(g,c);
  hist.push({o,guess:g.name,dist:p.dist,timedOut:!!timedOut});
  c.g.classList.add("correct"); c.lbl.classList.add("correct"); c.tick&&c.tick.classList.add("show"); g.tick&&g.tick.classList.add("show"); view.classList.add("revealed");
  if(p.dist>0){ p.lca.g.classList.add("lca"); p.lca.lbl&&p.lca.lbl.classList.add("lca"); }
  [...p.up,...p.down].forEach((n,i)=>{ const e=n.edge; const len=e.getTotalLength(); e.style.setProperty("--len",len); e.classList.add("path","draw"); e.style.animationDelay=(i*0.05)+"s"; e.parentNode.appendChild(e); });
  chipNode=c; chip.textContent=o.leaf; chip.classList.add("on","green"); placeChip();
  const mid={x:(g.x+c.x)/2,y:(g.y+c.y)/2}, Hv=H-sheetH()-70, spread=Math.hypot(g.x-c.x,g.y-c.y)+140;
  s=Math.max(.15,Math.min(2.4,Math.min(W,Hv)/spread)); tx=-mid.x*s; ty=-mid.y*s-sheetH()/2+35; apply();
  let msg;
  if(timedOut) msg=`Time's up — counted from the root. <b>${p.dist} branches</b> off.`;
  else if(p.dist===0) msg=`<span class="ok">Exactly right.</span>`;
  else if(p.dist<=2) msg=`<b>${p.dist} branch${p.dist>1?"es":""}</b> off. Very close.`;
  else if(p.dist<=5) msg=`<b>${p.dist} branches</b> off.`;
  else msg=`<b>${p.dist} branches</b> off. Last shared ancestor: ${p.lca.name}.`;
  $("status").innerHTML=`${msg} <span class="path">${o.name} sits at ${ancestors(c).slice(0,4).map(n=>n.name).join(" ‹ ")}.</span>`;
  const go=$("go"); go.className="go"+(p.dist===0?" green":""); go.textContent=round===orgs.length-1?"See results":"Next organism";
  go.onclick=()=>{ round++; round<orgs.length?startRound():results(); }; dots();
}
const pip=d=>d===0?"🟩":d<=2?"🟨":d<=5?"🟧":"🟥";
const fmt=ms=>{const t=Math.round(ms/1000);return`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;};
function results(){
  $("sheet").classList.add("hide"); round=orgs.length; dots(); view.classList.remove("nolabels"); fit();
  const total=hist.reduce((a,h)=>a+h.dist,0);
  const [rank,sub]=total===0?["Perfect cladist","Every organism on the right tip. Willi Hennig salutes you."]:
    total<=3?["Systematist","You know your clades. Misses were a branch or two at most."]:
    total<=8?["Field naturalist","Solid instincts, with a slip in the deep branches."]:
    total<=16?["Curious amateur","The big groups are there; the fine structure needs another look."]:
    ["Cambrian explosion","Lots of branches in play. The tree makes more sense every run."];
  const modeTxt=`${LAYOUT==="radial"?"circular":"cladogram"} · ${MODE==="clades"?"clades only":"latin tips"}`;
  $("card").innerHTML=`<p class="big">${total}<small>branches off · ${fmt(totalMs)}</small></p><p class="rank">${rank}</p><p class="sub">${sub} ${modeTxt}.</p>
    <div class="pips">${hist.map(h=>pip(h.dist)).join("")}</div>
    ${hist.map(h=>`<div class="rr"><div><div class="n">${h.o.name}</div><div class="w">${h.dist===0?`<span>${h.o.leaf}</span>`:`${h.timedOut?"no placement":"you chose "+(LATIN[h.guess]?LATIN[h.guess]+" ("+h.guess+")":h.guess)} · belongs with <span>${h.o.leaf}</span>`}</div></div><div class="d ${h.dist===0?'z':''}">${h.dist}</div></div>`).join("")}
    <div class="row"><button class="go ghost" id="again">Play again</button><button class="go green" id="share">Share score</button></div>`;
  $("overlay").classList.add("on"); $("again").onclick=newGame;
  $("share").onclick=async()=>{ const text=`Tree Tap 🌳 ${modeTxt} · ${total} branches off · ${fmt(totalMs)}\n${hist.map(h=>pip(h.dist)).join("")}\n${hist.map(h=>`${h.o.name} ${h.dist===0?"✓":h.dist}`).join(" · ")}\n${location.href.split("#")[0]}`;
    try{ if(navigator.share) await navigator.share({title:"Tree Tap",text}); else { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } }
    catch(e){ try{await navigator.clipboard.writeText(text);toast("Copied to clipboard");}catch(_){toast("Couldn't share");} } };
}
new ResizeObserver(()=>document.body.style.setProperty("--sheetH",document.getElementById("sheet").offsetHeight+"px")).observe(document.querySelector("#sheet .inner"));
size(); newGame();
</script>
</body>
